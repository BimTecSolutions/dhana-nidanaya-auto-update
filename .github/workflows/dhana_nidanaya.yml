```yaml
name: Dhana Nidhanaya Auto Update

on:

  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allows you to manually run the workflow
  workflow_dispatch:

jobs:

  update-dhana-nidhanaya:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # Create Firebase service account file
      # ----------------------------------------------------------

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

      # ----------------------------------------------------------
      # Run scraper
      # ----------------------------------------------------------

      - name: Run Dhana Nidhanaya updater
        env:
          FIREBASE_CREDENTIALS: serviceAccountKey.json
        run: |
          python dhana_nidanaya_scrap.py

      # ----------------------------------------------------------
      # Delete credentials
      # ----------------------------------------------------------

      - name: Remove Firebase credentials
        if: always()
        run: |
          rm -f serviceAccountKey.json
```
